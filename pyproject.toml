[project]
name = "cortex-magma"
version = "0.1.0"
description = "一个基于 FastMCP 的 MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[tasks]>=4.1.0",
    "psutil>=7.2.2",
]

[project.scripts]
cortex-magma = "cortex_magma.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_magma"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-s"   # 不捕获 stdout,测试里的 print 直接显示
